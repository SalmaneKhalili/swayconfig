# Alacritty config
# https://alacritty.org/config-alacritty.html

[font]
size = 11.0

# MesloLGS Nerd Font Mono: patched monospace with Nerd Font glyphs (U+E000-U+F8FF).
# Required so nvim-web-devicons / NvChad file + LSP icons render instead of tofu.
[font.normal]
family = "MesloLGLDZ Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGLDZ Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGLDZ Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MesloLGLDZ Nerd Font Mono"
style = "Bold Italic"
